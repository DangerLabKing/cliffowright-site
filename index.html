<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cliff Wright</title>
    <meta
      name="description"
      content="Cliff Wright is an artist, technologist and builder in West Orange, NJ: enterprise transit systems, classroom software, rail games, home-lab automation and drawings."
    />
    <meta property="og:title" content="Cliff Wright" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cliffowright.com" />
    <meta property="og:image" content="https://cliffowright.com/logo.png" />
    <link rel="icon" href="/favicon.png" type="image/png" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Hidden copy of the contact form so Netlify Forms detects it at deploy time.
         Field names must match src/components/Contact.jsx. -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="topic" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
