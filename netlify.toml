# Netlify build & hosting config for cliffowright.com.
# Netlify reads this on every deploy; if it conflicts with the dashboard, this file wins.

[build]
  command = "npm run build"
  publish = "dist"

  [build.environment]
    # Match your local `node -v`
    NODE_VERSION = "22"

# The site is one page now. Send the old multi-page URLs to the matching section
# so any saved links still land somewhere useful.
[[redirects]]
  from = "/art"
  to = "/#art"
  status = 301
[[redirects]]
  from = "/projects"
  to = "/#work"
  status = 301
[[redirects]]
  from = "/blog"
  to = "/#blog"
  status = 301
[[redirects]]
  from = "/useful-stuff"
  to = "/#useful"
  status = 301
[[redirects]]
  from = "/contact"
  to = "/#contact"
  status = 301
[[redirects]]
  from = "/support"
  to = "https://buymeacoffee.com/cliffowright"
  status = 302

# Vite's built files have a content hash in their names, so they can be cached for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Basic security headers on every page.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
